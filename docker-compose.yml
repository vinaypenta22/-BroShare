services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: broshare
      POSTGRES_USER: broshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broshare"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://broshare:${POSTGRES_PASSWORD}@db:5432/broshare
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),3).close()"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://broshare:${POSTGRES_PASSWORD}@db:5432/broshare
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py tick_broshare --watch
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  postgres_data:
